aid: propel
name: Propel
description: >-
  Propel, Inc. is a Brooklyn-based fintech company, founded in 2014, that builds
  financial tools for Americans with low income. Its free consumer app, Providers
  (formerly Fresh EBT), is used by more than five million people each month to
  check their SNAP/EBT balances instantly across 49 states, Washington D.C., and
  U.S. territories, secure their benefits card with locking and fraud monitoring,
  find exclusive offers and discounts on groceries, phone plans, internet,
  utilities, and healthcare, receive alerts about benefit policy changes, browse
  local job and gig-work listings, and predict deposit dates. Propel is a
  consumer-facing mobile product and does not publish a public developer API,
  SDK, or developer portal; it operates a public status page and a signed
  RFC 9116 security.txt for coordinated vulnerability disclosure. The company is
  backed by Andreessen Horowitz (a16z), Nyca Partners, Kleiner Perkins, JPMorgan
  Chase, Salesforce Ventures, the Financial Health Network, and Flourish Ventures.
